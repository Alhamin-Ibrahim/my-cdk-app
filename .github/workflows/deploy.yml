name: Build and Push to ECR

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password \
          | docker login \
          --username AWS \
          --password-stdin 739275458314.dkr.ecr.eu-west-1.amazonaws.com

      - name: Build and push orchestrator
        run: |
          docker build -t orchestrator ./orchestrator
          docker tag orchestrator:latest 739275458314.dkr.ecr.eu-west-1.amazonaws.com/orchestrator:latest
          docker push 739275458314.dkr.ecr.eu-west-1.amazonaws.com/orchestrator:latest

      - name: Build and push retriever
        run: |
          docker build -t retriever ./retriever
          docker tag retriever:latest 739275458314.dkr.ecr.eu-west-1.amazonaws.com/retriever:latest
          docker push 739275458314.dkr.ecr.eu-west-1.amazonaws.com/retriever:latest

      - name: Build and push ingestion
        run: |
          docker build -t ingestion ./ingestion
          docker tag ingestion:latest 739275458314.dkr.ecr.eu-west-1.amazonaws.com/ingestion:latest
          docker push 739275458314.dkr.ecr.eu-west-1.amazonaws.com/ingestion:latest